name: Build Windows EXE

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]
  workflow_dispatch:
  workflow_call:

permissions: write-all

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7
     
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v1
     
      # - name: Restore NuGet packages
        # working-directory: ${{env.GITHUB_WORKSPACE}}
        # run: nuget restore ${{env.SOLUTION_FILE_PATH}}
     
      - name: Build
        working-directory: ${{env.GITHUB_WORKSPACE}}
        # Add additional options to the MSBuild command line here (like platform or verbosity level).
        # See https://docs.microsoft.com/visualstudio/msbuild/msbuild-command-line-reference
        run: msbuild /m /p:Configuration=Release MyDigClock.slnx /t:Build
     
      - name: Show Github infos
        run:  echo 'Workspace path ${{ github.workspace }} - runner.temp ${{ runner.temp }}'     
                 
      - name: list all dirs 
        run: ls -R
        
      # - name: get date/date 
        # env:
          # TZ: "America/Chicago"
        # run: | 
          # echo "NOW=$(date +'%m-%d-%Y-%I.%M.%S.%p')" >> $GITHUB_ENV   

      - name: get date/date 
        run: |
          $NOW=& Get-Date -format M-D-YY-hh.mm.ss.A
          echo "NOW=$NOW" >> $env:GITHUB_ENV
          

      # - name: Get current time
        # id: now
        # uses: josStorer/get-current-time@v2
        # with:
          # timezone: "America/Chicago"
          # format: M-D-YY-hh.mm.ss.A
          
      # - name: save time 
        # run: | 
          # echo "NOW=${{ steps.now.outputs.formattedTime }}" >> $GITHUB_ENV           

    
      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false    
          tag_name: ${{ env.NOW }}
          body: ${{ github.event.head_commit.message }}
          files: ${{ github.workspace }}\Release\MyDigClock.exe
          name: "Release ${{ env.NOW }}"
          